<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <title>Exercício 5 - Conversor de temperatura</title>
        <style>
            #container {
                display: none;
                background-color: black;
                color: white;
                text-align: center;
                align-content: center;
                font-size: 20pt;
                height: 200px;
            }
        </style
    </head>
    <body>
        <label>
            Temperatura em Celsius:
            <input type="text" id="celsius" placeholder="37" size="5" maxlength="5">
        </label>
        <button type="button" onclick="converter()">
            Converter para Fahrenheit
        </button>
        <div id="container">
        </div>

        <script>
            function converter() {
                let celsius = document.getElementById("celsius").value;
                if (celsius == "") {
                    alert("Por favor, insira uma temperatura em graus Celsius.");
                    return;
                }
                celsius = parseFloat(celsius)
                let fahrenheit = celsius * 9.0/5.0 + 32

                let container = document.getElementById("container");
                container.style.display="block";
                container.innerHTML = celsius + "&degC é igual a " + fahrenheit + "&degF";
            }
        </script>
    </body>
</html>
