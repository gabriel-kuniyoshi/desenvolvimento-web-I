<!--
https://getbootstrap.com/docs/5.3/components/carousel/

Exemplo
- Site: https://www.mercadolivre.com.br/
- Data: domingo 03 maio 2026 9h

Customização
- Duração da transição ao mudar de slide
- Indicador do carrossel
-->
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Carrossel do Mercado Livre</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <link href="carrossel.css" rel="stylesheet" />
    </head>
    <body>
        <div class="container">
            <div id="carouselExample" class="carousel slide">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="img/slide1.webp" class="d-block w-100" alt="Frete grátis na sua primeira compra. Exclusivo no APP. Consulte os termos e condições.">
                    </div>
                    <div class="carousel-item">
                        <img src="img/slide2.webp" class="d-block w-100" alt="5.5. Renove sua casa. Até 18x sem juros com cartão Mercado Pago. Consulte os termos e condições.">
                    </div>
                    <div class="carousel-item">
                        <img src="img/slide3.webp" class="d-block w-100" alt="tudo para o seu treino, FULL ENVIOS RÁPIDOS, ATÉ 50% OFF, Válido até 30.04.2026. Ver mais em Tudo Para o Seu Treino.">
                    </div>
                    <div class="carousel-item">
                        <img src="img/slide4.webp" class="d-block w-100" alt="PRA NÃO PERDER NENHUM LANCE, ATÉ 21X SEM JUROS COM CARTÃO MERCADO PAGO, ATÉ 60% OFF, Válido até 30.04.2026. Ver mais em A Torcida Começa Em Casa.">
                    </div>
                    <div class="carousel-item">
                        <img src="img/slide5.webp" class="d-block w-100" alt="TUDO PARA O SEU VEÍCULO, FULL ENVIOS RÁPIDOS, Capa de Chuva Motoqueiro, Válido até 30.04.2026. Ver mais em Tudo Para o Seu Veículo.">
                    </div>
                    <div class="carousel-item">
                        <img src="img/slide6.webp" class="d-block w-100" alt="Marcas queridinhas de suplementos. Envio mais rápido do Brasil. Até 60% OFF. Consulte os termos e condições.">
                    </div>
                    <div class="carousel-item">
                        <img src="img/slide7.webp" class="d-block w-100" alt="meli+. Apple Originals. Sem anúncios. Apple TV incluído no plano Mega. tv + N + Disney+ + HBO max. *Confira condições. MONARCH LEGADO DE MONSTROS.">
                    </div>
                </div>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Próximo</span>
                </button>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Página 1"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="Página 2"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2" aria-label="Página 3"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="3" aria-label="Página 4"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="4" aria-label="Página 5"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="5" aria-label="Página 6"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="6" aria-label="Página 7"></button>
                </div>
            </div>
        </div>
    </body>
</html>
