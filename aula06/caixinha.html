<!--
Leitor de tela
- O atributo lang do elemento html define a linguagem da página
- Para palavras estrangeiras, utilize o atributo lang com valor adequado.

"O elemento HTML <i> representa uma parte do texto que é destacada do restante
por algum motivo, por exemplo, [...] expressões de outros idiomas [...]."
-->
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <title>Caixinha</title>
    </head>
    <style>
        #caixinha {
            /* Content */
            width: 500px;
            height: 600px;
            /* Padding */
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            /* Border */
            border-top: 10px solid black;
            border-right: 10px solid black;
            border-bottom: 10px solid black;
            border-left: 10px solid black;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
            border-bottom-left-radius: 20px;
            /* Margin */
            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
            /* Background */
            background-clip: content-box;
            background-color: rgb(223, 216, 181);
        }
        h1 {
            text-align: center;
            /* Border */
            border-width: 4px;
            border-style: dashed;
            border-color: black;
            /* Background */
            background-clip: border-box;
            background-color: #bda68e;
        }
        code {
            background-color: lightgray;
        }
    </style>
    <body>
        <div id="caixinha">
            <h1>Caixinha</h1>
            <p>Uma caixinha tem quatro camadas: <i lang="en">content</i>, <i lang="en">padding</i>, <i lang="en">border</i> e <i lang="en">margin</i>.</p>
            <p>As propiedades <i lang="en">width</i> e <i lang="en">height</i> são relativas à camada <i lang="en">content</i>.</p>
            <p>Note que margens verticais colapsam.</p>
            <p>Com a regrinha <code lang="en">background-clip: content-box;</code>, a propiedade <i lang="en">background-color</i> pinta apenas a camada <i lang="en">content</i>. </p>
        </div>
    </body>
</html>
